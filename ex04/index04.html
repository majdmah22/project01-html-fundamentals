<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <h1>Registration Form</h1>

    <form>

        <p>
            <label for="full-name">Full Name:</label>
            <input type="text" id="full-name" name="full-name" required>
        </p>

        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" minlength="8" required>
        </p>

        <fieldset>
            <legend>Preferred Learning Method</legend>

            <p>
                <input type="radio" id="online" name="learning-method" value="online" required>
                <label for="online">Online</label>
            </p>

            <p>
                <input type="radio" id="classroom" name="learning-method" value="classroom">
                <label for="classroom">Classroom</label>
            </p>
        </fieldset>

        <p>
            <input type="checkbox" id="agreement" name="agreement" required>
            <label for="agreement">I agree to the terms.</label>
        </p>

        <p>
            <label for="level">Experience Level:</label>
            <select id="level" name="level" required>
                <option value="">Select a level</option>
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
            </select>
        </p>

        <p>
            <label for="message">About Me:</label>
            <br>
            <textarea id="message" name="message" rows="5" cols="30"></textarea>
        </p>

        <button type="submit">Register</button>

    </form>

</body>
</html>
